services:
  new-api-merge:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api-merge-validate:latest
    container_name: new-api-merge-validate
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:123456@postgres-merge:5432/new-api
      REDIS_CONN_STRING: redis://:123456@redis-merge:6379
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-merge-validate
      SESSION_SECRET: merge-validate-local-secret
    depends_on:
      redis-merge:
        condition: service_started
      postgres-merge:
        condition: service_started
    networks:
      - new-api-merge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-merge:
    image: redis:latest
    container_name: redis-merge-validate
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - new-api-merge-network

  postgres-merge:
    image: postgres:15
    container_name: postgres-merge-validate
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: new-api
    volumes:
      - pg_data_merge:/var/lib/postgresql/data
    networks:
      - new-api-merge-network

volumes:
  pg_data_merge:

networks:
  new-api-merge-network:
    driver: bridge
